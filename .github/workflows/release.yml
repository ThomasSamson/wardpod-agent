name: Publication

# Une étiquette vX.Y.Z publie l'agent à cette version :
#   docker.io/thomassamson33/wardpod-agent:X.Y.Z (scanner intégré) et
#   :X.Y.Z-slim (sans trivy), amd64 et arm64 ;
#   oci://ghcr.io/thomassamson/charts/wardpod-agent, version X.Y.Z.
# Images et chart sont signés par cosign, par leur empreinte, avec la clé du
# projet (clé publique : cosign.pub, à la racine du dépôt).
# Secrets du dépôt : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, COSIGN_PRIVATE_KEY,
# COSIGN_PASSWORD. Seuls les mainteneurs peuvent poser une étiquette ; une
# pull request ne reçoit jamais ces secrets.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Les actions sont épinglées par SHA de commit. Les valeurs issues de
# l'étiquette passent par l'environnement, jamais interpolées dans les
# scripts.
jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Version
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "étiquette $TAG : vX.Y.Z attendu" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Tests
        run: make lint vuln test-unit test-integration chart-lint chart-test

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: agent
            target: agent
            suffix: ""
          - name: agent-slim
            target: agent-slim
            suffix: "-slim"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Connexion à Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: docker.io/thomassamson33/wardpod-agent:${{ needs.test.outputs.version }}${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
            COMMIT=${{ github.sha }}
      - name: Empreinte
        env:
          REF: docker.io/thomassamson33/wardpod-agent@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: mkdir -p digests && echo "$REF" > "digests/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 1

  chart:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Chart en OCI
        id: push
        env:
          VERSION: ${{ needs.test.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          make chart-package VERSION="$VERSION"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          out=$(helm push "dist/wardpod-agent-$VERSION.tgz" oci://ghcr.io/thomassamson/charts 2>&1)
          echo "$out"
          digest=$(echo "$out" | sed -n 's/^Digest: //p')
          case "$digest" in sha256:*) ;; *) echo "empreinte du chart introuvable" >&2; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  sign:
    needs: [images, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Connexion à Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Connexion à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      # Par l'empreinte : l'étiquette pourrait déjà désigner autre chose.
      # --recursive : l'index multi-architecture et chacune de ses images.
      - name: Signature des images et du chart
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CHART: ghcr.io/thomassamson/charts/wardpod-agent@${{ needs.chart.outputs.digest }}
        run: |
          set -eu
          [ "$(ls digests | wc -l)" = 2 ] || { ls digests; echo "2 empreintes attendues" >&2; exit 1; }
          for f in digests/*; do
            ref=$(cat "$f")
            case "$ref" in docker.io/thomassamson33/wardpod-agent@sha256:*) ;; *) echo "empreinte invalide : $ref" >&2; exit 1 ;; esac
            cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$ref"
          done
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$CHART"
